<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace">
  <defs>
    <!-- Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f2e" stroke-width="1"/>
    </pattern>

    <!-- Gradients for boxes -->
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="macGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2438"/>
      <stop offset="100%" stop-color="#1a1424"/>
    </linearGradient>
    <linearGradient id="fpgaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2818"/>
      <stop offset="100%" stop-color="#251810"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d9ff"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb84d"/>
    </marker>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5e9c"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#0a0e17"/>
  <rect width="1400" height="900" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="60" y="60" fill="#e8eef7" font-size="28" font-weight="700" letter-spacing="2">DMA MEMORY READING ARCHITECTURE</text>
  <text x="60" y="84" fill="#5a6a82" font-size="13" letter-spacing="3">SYSTEM TOPOLOGY · PCILEECH-BASED MEMORY ACQUISITION</text>
  <line x1="60" y1="100" x2="1340" y2="100" stroke="#1f2937" stroke-width="1"/>

  <!-- ============== GAMING PC (Windows) ============== -->
  <g>
    <rect x="80" y="170" width="420" height="410" rx="8" fill="url(#winGrad)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="80" y="170" width="420" height="36" rx="8" fill="#3b82f6"/>
    <rect x="80" y="194" width="420" height="12" fill="#3b82f6"/>
    <text x="100" y="194" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="2">GAMING COMPUTER</text>
    <text x="480" y="194" fill="#ffffff" font-size="11" text-anchor="end" letter-spacing="1">WINDOWS · HEADLESS</text>

    <!-- The Game -->
    <rect x="110" y="240" width="170" height="90" rx="6" fill="#0a1a2e" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="195" y="270" fill="#60a5fa" font-size="10" text-anchor="middle" letter-spacing="2">PROCESS</text>
    <text x="195" y="295" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">THE GAME</text>
    <text x="195" y="316" fill="#7a8aa3" font-size="10" text-anchor="middle">target memory space</text>

    <!-- Apollo -->
    <rect x="300" y="240" width="170" height="90" rx="6" fill="#0a1a2e" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="385" y="270" fill="#60a5fa" font-size="10" text-anchor="middle" letter-spacing="2">SERVER</text>
    <text x="385" y="295" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">APOLLO</text>
    <text x="385" y="316" fill="#7a8aa3" font-size="10" text-anchor="middle">game streaming host</text>

    <!-- PCIe / Thunderbolt port labels -->
    <rect x="110" y="370" width="360" height="60" rx="4" fill="#050a14" stroke="#1f3a5f" stroke-width="1"/>
    <text x="290" y="392" fill="#5a6a82" font-size="10" text-anchor="middle" letter-spacing="2">HARDWARE INTERFACES</text>
    <text x="290" y="415" fill="#a8b8d0" font-size="12" text-anchor="middle">Thunderbolt × 2  ·  10GbE NIC</text>

    <text x="100" y="475" fill="#5a6a82" font-size="10" letter-spacing="2">ROLE</text>
    <text x="100" y="495" fill="#a8b8d0" font-size="12">Runs game + streams video output;</text>
    <text x="100" y="513" fill="#a8b8d0" font-size="12">memory is read externally via DMA.</text>
    <text x="100" y="531" fill="#5a6a82" font-size="11" font-style="italic">No display attached.</text>
  </g>

  <!-- ============== MAC ============== -->
  <g>
    <rect x="900" y="170" width="420" height="410" rx="8" fill="url(#macGrad)" stroke="#a78bfa" stroke-width="2"/>
    <rect x="900" y="170" width="420" height="36" rx="8" fill="#a78bfa"/>
    <rect x="900" y="194" width="420" height="12" fill="#a78bfa"/>
    <text x="920" y="194" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="2">MAC</text>
    <text x="1300" y="194" fill="#ffffff" font-size="11" text-anchor="end" letter-spacing="1">OPERATOR WORKSTATION</text>

    <!-- Moonlight -->
    <rect x="920" y="225" width="170" height="90" rx="6" fill="#1a0f24" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1005" y="251" fill="#c4b5fd" font-size="10" text-anchor="middle" letter-spacing="2">CLIENT (FORK)</text>
    <text x="1005" y="276" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">MOONLIGHT</text>
    <text x="1005" y="297" fill="#a89cc4" font-size="10" text-anchor="middle">renders stream + overlays</text>

    <!-- Oasis -->
    <rect x="1130" y="225" width="170" height="90" rx="6" fill="#1a0f24" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1215" y="251" fill="#c4b5fd" font-size="10" text-anchor="middle" letter-spacing="2">DMA CONTROLLER</text>
    <text x="1215" y="276" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">OASIS</text>
    <text x="1215" y="297" fill="#a89cc4" font-size="10" text-anchor="middle">drives 2× FPGA via pcileech</text>

    <!-- Shared Memory connector block -->
    <rect x="920" y="345" width="380" height="78" rx="6" fill="#0f0818" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1110" y="368" fill="#10b981" font-size="10" text-anchor="middle" letter-spacing="3" font-weight="700">SHARED MEMORY  ·  OS-LEVEL IPC</text>
    <text x="1110" y="389" fill="#7fc8a9" font-size="11" text-anchor="middle">framebuffer (w × h, triple-buffered)  ·  overlays  ·  inputs</text>
    <text x="1110" y="408" fill="#5a8a72" font-size="9" font-style="italic" text-anchor="middle">created by Moonlight on startup · read/write by both processes</text>

    <!-- Moonlight ↔ shared mem (bidirectional, simple) -->
    <path d="M 1005 315 L 1005 345" stroke="#c4b5fd" stroke-width="2" fill="none" marker-end="url(#arrowViolet)"/>
    <path d="M 1015 345 L 1015 315" stroke="#c4b5fd" stroke-width="2" fill="none" marker-end="url(#arrowViolet)"/>

    <!-- Oasis ↔ shared mem (bidirectional, simple) -->
    <path d="M 1215 315 L 1215 345" stroke="#c4b5fd" stroke-width="2" fill="none" marker-end="url(#arrowViolet)"/>
    <path d="M 1225 345 L 1225 315" stroke="#c4b5fd" stroke-width="2" fill="none" marker-end="url(#arrowViolet)"/>

    <!-- Hardware -->
    <rect x="920" y="445" width="380" height="50" rx="4" fill="#0f0818" stroke="#3d2c5f" stroke-width="1"/>
    <text x="1110" y="465" fill="#5a6a82" font-size="10" text-anchor="middle" letter-spacing="2">HARDWARE INTERFACES</text>
    <text x="1110" y="484" fill="#bca8d0" font-size="12" text-anchor="middle">USB × 2 (10 Gbps)  ·  10GbE NIC</text>

    <text x="920" y="520" fill="#5a6a82" font-size="10" letter-spacing="2">ROLE</text>
    <text x="920" y="538" fill="#bca8d0" font-size="12">Renders stream, captures operator input,</text>
    <text x="920" y="554" fill="#bca8d0" font-size="12">reads game memory, draws overlays.</text>
  </g>

  <!-- ============== FPGA STACK (center) ============== -->
  <g>
    <rect x="570" y="240" width="260" height="310" rx="8" fill="url(#fpgaGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="570" y="240" width="260" height="32" rx="8" fill="#f59e0b"/>
    <rect x="570" y="262" width="260" height="10" fill="#f59e0b"/>
    <text x="700" y="261" fill="#1a1208" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">DMA HARDWARE</text>

    <!-- FPGA 1 -->
    <rect x="595" y="295" width="210" height="100" rx="6" fill="#1a0f06" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="700" y="320" fill="#fbbf24" font-size="11" text-anchor="middle" letter-spacing="2">FPGA · 01 · CAMERA</text>
    <text x="700" y="346" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">ARTIX-7 100T</text>
    <text x="700" y="368" fill="#d4a574" font-size="10" text-anchor="middle">reads camera memory</text>
    <text x="700" y="384" fill="#8a7a5a" font-size="9" text-anchor="middle">pcileech firmware</text>

    <!-- FPGA 2 -->
    <rect x="595" y="415" width="210" height="100" rx="6" fill="#1a0f06" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="700" y="440" fill="#fbbf24" font-size="11" text-anchor="middle" letter-spacing="2">FPGA · 02 · GAME STATE</text>
    <text x="700" y="466" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">ARTIX-7 100T</text>
    <text x="700" y="488" fill="#d4a574" font-size="10" text-anchor="middle">reads game state memory</text>
    <text x="700" y="504" fill="#8a7a5a" font-size="9" text-anchor="middle">pcileech firmware</text>
  </g>

  <!-- ============== CONNECTIONS ============== -->

  <!-- Thunderbolt: Gaming PC → FPGAs -->
  <g>
    <!-- to FPGA 1 -->
    <path d="M 500 345 L 595 345" stroke="#00d9ff" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)"/>
    <!-- to FPGA 2 -->
    <path d="M 500 360 L 540 360 L 540 465 L 595 465" stroke="#00d9ff" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)"/>
    <text x="510" y="335" fill="#00d9ff" font-size="11" font-weight="700" letter-spacing="1">THUNDERBOLT</text>
    <text x="510" y="378" fill="#5a8aa3" font-size="9">PCIe over TB · 2 links</text>
  </g>

  <!-- USB: FPGAs → Mac -->
  <g>
    <!-- FPGA 1 to Mac -->
    <path d="M 805 345 L 900 345" stroke="#ffb84d" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)"/>
    <!-- FPGA 2 to Mac -->
    <path d="M 805 465 L 860 465 L 860 360 L 900 360" stroke="#ffb84d" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)"/>
    <text x="890" y="335" fill="#ffb84d" font-size="11" font-weight="700" letter-spacing="1" text-anchor="end">USB · 10 Gbps</text>
    <text x="890" y="378" fill="#a37f4d" font-size="9" text-anchor="end">control + data · 2 links</text>
  </g>

  <!-- 10GbE Network: Gaming PC ↔ Mac -->
  <g>
    <path d="M 290 580 L 290 720 L 1110 720 L 1110 580" stroke="#ff5e9c" stroke-width="2.5" fill="none" stroke-dasharray="0"/>
    <!-- bidirectional arrows -->
    <polygon points="285,590 295,590 290,580" fill="#ff5e9c"/>
    <polygon points="1105,590 1115,590 1110,580" fill="#ff5e9c"/>

    <rect x="580" y="698" width="240" height="44" rx="4" fill="#0a0e17" stroke="#ff5e9c" stroke-width="1.5"/>
    <text x="700" y="717" fill="#ff5e9c" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">INTERNAL NETWORK · 10 GbE</text>
    <text x="700" y="733" fill="#a36680" font-size="10" text-anchor="middle">video stream + input events</text>
  </g>

  <!-- ============== LEGEND / DATA FLOW ============== -->
  <g transform="translate(80, 770)">
    <text x="0" y="0" fill="#5a6a82" font-size="11" letter-spacing="3">CONNECTIONS</text>
    <line x1="0" y1="14" x2="1240" y2="14" stroke="#1f2937" stroke-width="1"/>

    <!-- Thunderbolt -->
    <line x1="0" y1="40" x2="40" y2="40" stroke="#00d9ff" stroke-width="3"/>
    <text x="50" y="36" fill="#e8eef7" font-size="12" font-weight="700">THUNDERBOLT</text>
    <text x="50" y="52" fill="#7a8aa3" font-size="10">FPGAs ⇄ Gaming PC · PCIe DMA</text>

    <!-- USB -->
    <line x1="320" y1="40" x2="360" y2="40" stroke="#ffb84d" stroke-width="3"/>
    <text x="370" y="36" fill="#e8eef7" font-size="12" font-weight="700">USB · 10 Gbps</text>
    <text x="370" y="52" fill="#7a8aa3" font-size="10">FPGAs ⇄ Mac · oasis control</text>

    <!-- 10GbE -->
    <line x1="640" y1="40" x2="680" y2="40" stroke="#ff5e9c" stroke-width="3"/>
    <text x="690" y="36" fill="#e8eef7" font-size="12" font-weight="700">10 GbE LAN</text>
    <text x="690" y="52" fill="#7a8aa3" font-size="10">Mac ⇄ Gaming PC · stream + input</text>

    <!-- Footer note -->
    <text x="960" y="36" fill="#5a6a82" font-size="10" letter-spacing="1">2× ARTIX-7 100T FPGA</text>
    <text x="960" y="52" fill="#7a8aa3" font-size="10">pcileech-based memory acquisition</text>
  </g>
</svg>
